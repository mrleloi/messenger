server {
    server_name baity-dev.baityapp.online www.baity-dev.baityapp.online;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    index index.html index.htm index.php;

    charset utf-8;
	
	location /janus {
		proxy_set_header Host $host;
		proxy_set_header Connection "";
		proxy_http_version 1.1;

		proxy_pass janus:8088;
    }

	location /janus-admin {
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        proxy_pass janus:7088;
	}

    location /janus-ws {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $host;
		proxy_pass janus:8188;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 80;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/nginx/certificates/cert.pem; # managed by Cer>
    ssl_certificate_key /etc/nginx/certificates/key.pem; # managed by C>
    #include /etc/nginx/ssl/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/nginx/ssl/ssl-dhparams.pem; # managed by Certbot

}