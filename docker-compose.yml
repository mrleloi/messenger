  #     MYSQL_DATABASE: laravel
  #     MYSQL_ROOT_PASSWORD: password
  #     SERVICE_TAGS: dev
  #     SERVICE_NAME: mysql
  #   volumes:
  #     - dbdata:/var/lib/mysql/
  #     - ./docker-main/mysql/:/etc/mysql/
  #   networks:
  #     - app-network

#Volumes
volumes:
  cache_data:
    driver: local

#Networks
networks:
  app-network:
    driver: bridge
